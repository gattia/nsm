# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: build

on:
  push:
    branches: [ main, development]
  pull_request:

jobs:

  lint:
    # Lint reports pre-existing style issues across the whole repo; do not
    # block PR merges on them. (~600 pre-existing flake8 violations across
    # NSM/ + testing/ when the .flake8 max-line-length is set to Black's
    # 100 chars -- including F821 undefined names, F841 unused locals,
    # F403 star imports, and assorted whitespace/style. Cleanup is its own
    # PR.) Lint output stays visible in the run for anyone who wants to
    # work through it; it just doesn't gate merging.
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: [3.9]
    
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          make install-dev

      - name: Lint - isort, black
        run: |
          make lint

  build:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: [3.9]

    steps:
      - uses: actions/checkout@v2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the GitHub-hosted runner has no GPU, so the
          # default torch wheel pulls in ~5 GB of nvidia-cuda-* packages
          # and fills the runner's disk before pymskt / pyvista / vtk get
          # a chance to install. Install the CPU wheel first; make
          # install-dev's `pip install -r requirements.txt` then sees the
          # torch requirement already satisfied and skips re-pulling.
          pip install torch torchvision torchaudio \
              --index-url https://download.pytorch.org/whl/cpu
          # pymskt.image.t2 has a hard import of nibabel but does not list
          # it in install_requires (upstream packaging bug). Workaround:
          # install nibabel explicitly so `import pymskt.mesh` doesn't
          # transitively fail.
          pip install nibabel
          make install-dev
      - name: Test with pytest
        run: |
          make test
