#https://peps.python.org/pep-0621
#pyproject.toml requirements: 
#https://packaging.python.org/en/latest/specifications/declaring-project-metadata/
# also some ideas from scikit:
# https://scikit-hep.org/developer/pep621

#Specify the requirements needed to build the package.
[build-system]
# setuptools>=61 is not a preference: the [project] table below, [tool.setuptools.packages]
# and [tool.setuptools.package-data] all landed in 61.0, and an older one reads none of
# them. Unpinned "setuptools" hid that, because pip's build isolation installs the latest.
# Measured against 58.1.0 -- the version on a GitHub macOS runner -- with
# --no-build-isolation: it builds an "UNKNOWN-0.0.0" wheel containing no NSM package at
# all, and on the runner's stack it fails outright at "Preparing metadata".
requires = ["setuptools>=61", "setuptools-scm"]
build-backend = "setuptools.build_meta"

#Specify the requirements needed to build the project itself. 
#Instructions for defining the project info
[project]
name = "NSM"
description = "Library for creating Neural Shape Models (NSM)"
readme = "README.md"
# Every runtime dependency requires >=3.9 -- mskt, torch, numpy, scipy, wandb,
# scikit-image, pymeshfix and the rest, measured from their installed metadata, not read
# off their docs. ">=3.7" here came from the original project boilerplate (fe403ad) and
# was never true of NSM: on 3.7 or 3.8 the dependency set does not resolve, and since
# v0.3.0 NSM/__init__.py uses importlib.metadata, which is 3.8+. 3.9 is also the only
# version CI tests. Pinned by testing/NSM/test_packaging.py::TestTheSupportedPythons.
requires-python = ">=3.9"
keywords = ["python"]
license = {text = "MIT"}
authors = [
  { name = "Anthony Gatti", email = "aagatti@stanford.edu" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
]
dependencies = []
dynamic = ["version"]


[project.urls]
Homepage = "https://github.com/gattia/NSM/"
Documentation = "https://anthonygattiphd.com/NSM/" 

# setuptools specific items
[tool.setuptools.packages]
# `namespaces` defaults to true here, which is why NSM.configs is found at all -- it has
# no __init__.py. That gets the generator into the wheel; the JSON it generates needs the
# package-data entry below, and did not have one until v0.3.0.
find = {include = ['NSM', 'NSM.*']}

# default_config.json is what every doc in this repo calls "the shipped default config",
# and no built distribution contained it: `find` packages modules, not data. It worked
# only because every install so far has been editable. Stated explicitly rather than left
# to include-package-data, which sources its file list from the SCM and would therefore
# drop the file again in a tree with no git metadata.
[tool.setuptools.package-data]
"NSM.configs" = ["*.json"]


# information about "tools" 
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100
include_trailing_comma = true
sections = ['FUTURE', 'STDLIB', 'THIRDPARTY', 'FIRSTPARTY', 'LOCALFOLDER']
known_first_party = ["cython_functions"]

[tool.black]
line-length = 100
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

# The version is the git tag, and nothing else. It used to be
# `[tool.setuptools.dynamic] version = {attr = "NSM.__version__"}` reading a string
# literal, which said 0.2.0 for 269 commits and 34 breaking changes -- the same failure
# that left it at 0.0.1 for years. https://github.com/pypa/setuptools_scm/
[tool.setuptools_scm]
# What a commit BETWEEN releases is called. The default, "guess-next-dev", names it after
# a release that does not exist yet -- five commits past v0.3.0 becomes "0.3.1.dev5",
# asserting a 0.3.1 nobody has planned. "no-guess-dev" names it after the release it is
# actually past: "0.3.0.post1.dev5". Measured: both order correctly under PEP 440
# (0.3.0 < 0.3.0.post1.dev5 < 0.3.1 < 0.4.0) and both are prereleases, so pip skips them
# without --pre either way. The difference is only what the string claims.
version_scheme = "no-guess-dev"

# Without this a tree with no git metadata does not build at all -- measured, `pip wheel`
# stops at "Getting requirements to build wheel". That tree is a real case: a GitHub
# source zip, a vendored copy, `git archive`. A version that says it does not know is a
# better answer than a build failure, and better than a stale number that looks real.
fallback_version = "0.0.0+unknown"

[tool.coverage]
run.omit = ["testing/*", "*/*_test.py"]

[tool.pytest.ini_options]
# Tests live in testing/, not tests/. The previous value named a directory that does
# not exist, and collection worked only through pytest's rootdir fallback.
testpaths = ["testing"]
pythonpath = ["."]