# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: build

on:
  push:
    branches: [ main, development]
  pull_request:

jobs:

  lint:
    # NSM/ + testing/ report zero flake8 violations and are clean under isort and
    # black, so this gates. It did not previously: the backlog was several hundred
    # and the job carried continue-on-error, which is how nine files drifted out of
    # black compliance without anyone seeing it.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: [3.9]
    
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          make install-dev

      - name: Lint - isort, black, flake8
        run: |
          make lint

  build:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: [3.9]

    steps:
      - uses: actions/checkout@v2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the GitHub-hosted runner has no GPU, so the
          # default torch wheel pulls in ~5 GB of nvidia-cuda-* packages
          # and fills the runner's disk before pymskt / pyvista / vtk get
          # a chance to install. Install the CPU wheel first; make
          # install-dev's `pip install -r requirements.txt` then sees the
          # torch requirement already satisfied and skips re-pulling.
          pip install torch torchvision torchaudio \
              --index-url https://download.pytorch.org/whl/cpu
          # pymskt.image.t2 has a hard import of nibabel but does not list
          # it in install_requires (upstream packaging bug). Workaround:
          # install nibabel explicitly so `import pymskt.mesh` doesn't
          # transitively fail.
          pip install nibabel
          make install-dev
      - name: Test with pytest
        run: |
          make test
